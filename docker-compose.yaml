version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: supabase-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-postgres}
      POSTGRES_USER: ${DB_USER:-postgres.lagalzfcwecqjtkgaeft}
      POSTGRES_PASSWORD: ${DB_PASS:-CmLZXHsLtaDiphK7}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres.lagalzfcwecqjtkgaeft} -d ${DB_NAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5


volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge